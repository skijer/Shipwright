name: Sign a mod
description: Scan, build and sign the mods of your repository and list them in the in-game NEI-Store.
title: "Sign mods: "
labels: [sign-mod]
body:
  - type: markdown
    attributes:
      value: |
        The sign-mod workflow checks out your repository at the commit you give, scans the sources, builds them
        with Unbound's own build files, checks what the binaries import and signs the packages with your GitHub
        name, repository and commit. Signed mods go straight into the NEI-Store (Network > NEI-Store in game).
        If any step fails nothing is signed, and the log says why.

        Open **one issue per repository and keep it open**: it is your mods' page. A maintainer approves it once.
        After that, publish a GitHub release in your repository, or comment `/sign <tag or commit>`, and only the
        mods whose sources changed are signed again. `/unlist <mod>` takes a mod out of the store, `/relist <mod>`
        brings it back. A `packs.json` next to your mods groups them into packs players can pick parts of.
        See mod-sdk/docs/SIGNING.md for the rules.
  - type: input
    id: repository
    attributes:
      label: Mod repository
      description: A public repository you own, as owner/name.
      placeholder: your-name/your-mods
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The full 40-character commit hash to sign.
    validations:
      required: true
  - type: input
    id: directory
    attributes:
      label: Mods folder
      description: The folder whose subfolders are your mods. Leave empty for "mods".
      placeholder: mods
