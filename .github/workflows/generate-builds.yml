name: generate-builds
# SOH [fork] This repo ships two products from one workflow:
#   - "SoH (cel-shading fork)"  branch wind-waker-style-cel-shading, tags <SoH-version>-celshade<X.Y>
#   - "SoH: Unbound"            branch unbound,                      tags <SoH-version>-unbound<X.Y>
# Pushes to a release branch build all three platforms and save the ccache/deps/vcpkg/macports caches.
# Pushing a release tag builds nothing itself: a run on a tag ref cannot read caches saved by a branch
# (only its own ref's and the default branch's), so it would build cold. It starts this workflow on
# the tag's product branch instead (workflow_dispatch with the tag as input), which reads that
# branch's caches, checks out the tag so the build sees it (the About box shows the release version
# only for a tagged commit), and publishes the release. Keep this file identical on both branches;
# the tag decides everything else (release-product.sh).
on:
  push:
    branches:
      - wind-waker-style-cel-shading
      - unbound
    tags:
      - '*celshade*'
      - '*unbound*'
  pull_request:
    branches:
      - wind-waker-style-cel-shading
      - unbound
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (already pushed, on this branch)
        required: true
        type: string
concurrency:
  # A release run shares its branch's ref, so the event keeps a branch push and a release from
  # cancelling each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:

  # Tag push: start the release run on the product's branch.
  dispatch-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
    - name: Start the release run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        BRANCH=$(.github/workflows/release-product.sh "$TAG" | sed -n 's/^branch=//p')
        gh workflow run generate-builds.yml -R "$GITHUB_REPOSITORY" --ref "$BRANCH" -f tag="$TAG"
        echo "Release run for ${TAG} started on ${BRANCH}"

  generate-soh-otr:
    # The build jobs below need this one, so skipping it on a tag push skips them too.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
        ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
    - name: Check the release tag
      if: inputs.tag
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        BRANCH=$(.github/workflows/release-product.sh "$TAG" | sed -n 's/^branch=//p')
        if [ "$BRANCH" != "$GITHUB_REF_NAME" ]; then
          echo "::error::${TAG} is released from ${BRANCH}; this run is on ${GITHUB_REF_NAME}"
          exit 1
        fi
        if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
          echo "::warning::${TAG} is not the head of ${BRANCH}; the build caches are the head's, so it may build cold"
        fi
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        save: ${{ github.event_name == 'push' }}
        key: ${{ runner.os }}-otr-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-otr-ccache-${{ github.ref }}
          ${{ runner.os }}-otr-ccache
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat .github/workflows/apt-deps.txt) libzip-dev zipcmp zipmerge ziptool
    - name: Restore Cached deps folder
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-deps-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-deps-${{ github.ref }}-
          ${{ runner.os }}-deps-
        path: deps
    - name: Create deps folder
      run: mkdir -p deps
    - name: Install latest SDL
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/SDL2-2.30.3" ]; then
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          tar -xzf SDL2-2.30.3.tar.gz -C deps
        fi
        cd deps/SDL2-2.30.3
        ./configure --enable-hidapi-libusb
        make -j 10
        sudo make install
        sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - name: Install latest tinyxml2
      run: |
        sudo apt-get remove libtinyxml2-dev
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/tinyxml2-10.0.0" ]; then
          wget https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
          tar -xzf 10.0.0.tar.gz -C deps
        fi
        cd deps/tinyxml2-10.0.0
        mkdir -p build
        cd build
        cmake ..
        make
        sudo make install
    - name: Generate soh.o2r
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
        cmake --build build-cmake --config Release --target GenerateSohOtr -j3
    - name: Upload soh.o2r
      uses: actions/upload-artifact@v7
      with:
        name: soh.o2r
        path: soh.o2r
        retention-days: 3

  build-macos:
    needs: generate-soh-otr
    runs-on: macos-14
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
        ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true
        save: ${{ github.event_name == 'push' }}
        key: ${{ runner.os }}-14-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-14-ccache-${{ github.ref }}
          ${{ runner.os }}-14-ccache
    # Needed to apply sudo for macports cache restore
    - name: Install gtar wrapper
      run: |
        sudo mv /opt/homebrew/bin/gtar /opt/homebrew/bin/gtar.orig
        sudo cp .github/workflows/gtar /opt/homebrew/bin/gtar
        sudo chmod +x /opt/homebrew/bin/gtar
    - name: Restore Cached MacPorts
      id: restore-cache-macports
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-14-macports-${{ hashFiles('.github/workflows/macports-deps.txt') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-14-macports-${{ hashFiles('.github/workflows/macports-deps.txt') }}-
          ${{ runner.os }}-14-macports-
        path: /opt/local/
    # Updated PATH applies to the next step and onwards
    - name: Install MacPorts (if necessary)
      run: |
        if command -v /opt/local/bin/port 2>&1 >/dev/null; then
          echo "MacPorts already installed"
        else
          echo "Installing MacPorts"
          wget https://github.com/macports/macports-base/releases/download/v2.11.5/MacPorts-2.11.5-14-Sonoma.pkg
          sudo installer -pkg ./MacPorts-2.11.5-14-Sonoma.pkg -target /
        fi
        echo "/opt/local/bin:/opt/local/sbin" >> "$GITHUB_PATH"
    - name: Install dependencies
      run: |
        brew uninstall --ignore-dependencies libpng
        sudo port install $(cat .github/workflows/macports-deps.txt)
        brew install ninja
    - name: Download soh.o2r
      uses: actions/download-artifact@v7
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Build SoH
      run: |
        export PATH="/usr/lib/ccache:/opt/homebrew/opt/ccache/libexec:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DBUILD_REMOTE_CONTROL=1
        cmake --build build-cmake --config Release --parallel 3
        (cd build-cmake && cpack)

        mv _packages/*.dmg SoH.dmg
        mv README.md readme.txt
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: soh-mac
        path: |
          SoH.dmg
          readme.txt
    - name: Build the unsafe mods edition
      if: hashFiles('soh/soh/ModApi/ModLoader.cpp') != ''
      run: |
        export PATH="/usr/lib/ccache:/opt/homebrew/opt/ccache/libexec:/usr/local/opt/ccache/libexec:$PATH"
        cp readme.txt README.md
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -DUNBOUND_MOD_POLICY=ask
        cmake --build build-cmake --config Release --parallel 3
        (cd build-cmake && cpack)
        mv _packages/*.dmg SoH-unbound-unsafe.dmg
    - name: Upload the unsafe mods edition
      if: hashFiles('soh/soh/ModApi/ModLoader.cpp') != ''
      uses: actions/upload-artifact@v7
      with:
        name: soh-unbound-unsafe-mac
        path: |
          SoH-unbound-unsafe.dmg
          readme.txt
    - name: Save Cache MacPorts
      if: ${{ github.event_name == 'push' }}
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-cache-macports.outputs.cache-primary-key }}
        path: /opt/local/

  build-linux:
    needs: generate-soh-otr
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
        ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat .github/workflows/apt-deps.txt)
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        save: ${{ github.event_name == 'push' }}
        key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref }}
          ${{ runner.os }}-ccache
    - name: Restore Cached deps folder
      id: restore-cache-deps
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-deps-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-deps-${{ github.ref }}-
          ${{ runner.os }}-deps-
        path: deps
    - name: Create deps folder
      run: mkdir -p deps
    - name: Install latest SDL
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/SDL2-2.30.3" ]; then
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          tar -xzf SDL2-2.30.3.tar.gz -C deps
        fi
        cd deps/SDL2-2.30.3
        ./configure --enable-hidapi-libusb
        make -j 10
        sudo make install
        sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - name: Install latest SDL_net
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/SDL2_net-2.2.0" ]; then
          wget https://www.libsdl.org/projects/SDL_net/release/SDL2_net-2.2.0.tar.gz
          tar -xzf SDL2_net-2.2.0.tar.gz -C deps
        fi
        cd deps/SDL2_net-2.2.0
        ./configure
        make -j 10
        sudo make install
        sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - name: Install latest tinyxml2
      run: |
        sudo apt-get remove libtinyxml2-dev
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/tinyxml2-10.0.0" ]; then
          wget https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
          tar -xzf 10.0.0.tar.gz -C deps
        fi
        cd deps/tinyxml2-10.0.0
        mkdir -p build
        cd build
        cmake ..
        make
        sudo make install
    - name: Install libzip without crypto
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/libzip-1.10.1" ]; then
          wget https://github.com/nih-at/libzip/releases/download/v1.10.1/libzip-1.10.1.tar.gz
          tar -xzf libzip-1.10.1.tar.gz -C deps
        fi
        cd deps/libzip-1.10.1
        mkdir -p build
        cd build
        cmake .. -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF -DENABLE_OPENSSL=OFF
        make
        sudo make install
        sudo cp -av /usr/local/lib/libzip* /lib/x86_64-linux-gnu/
    - name: Download soh.o2r
      uses: actions/download-artifact@v7
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Build SoH
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DBUILD_REMOTE_CONTROL=1
        cmake --build build-cmake --config Release -j3
        (cd build-cmake && cpack -G External)

        mv README.md readme.txt
        mv build-cmake/*.appimage soh.appimage
      env:
        CC: gcc-12
        CXX: g++-12
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: soh-linux
        path: |
          soh.appimage
          readme.txt
    - name: Build the unsafe mods edition
      if: hashFiles('soh/soh/ModApi/ModLoader.cpp') != ''
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cp readme.txt README.md
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -DUNBOUND_MOD_POLICY=ask
        cmake --build build-cmake --config Release -j3
        (cd build-cmake && cpack -G External)
        mv build-cmake/*.appimage soh-unbound-unsafe.appimage
      env:
        CC: gcc-12
        CXX: g++-12
    - name: Upload the unsafe mods edition
      if: hashFiles('soh/soh/ModApi/ModLoader.cpp') != ''
      uses: actions/upload-artifact@v7
      with:
        name: soh-unbound-unsafe-linux
        path: |
          soh-unbound-unsafe.appimage
          readme.txt
    - name: Save Cache deps folder
      if: ${{ github.event_name == 'push' }}
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-cache-deps.outputs.cache-primary-key }}
        path: deps

  build-windows:
    needs: generate-soh-otr
    runs-on: windows-latest
    steps:
    - name: Install dependencies
      run: |
        choco install ninja -y
        Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
        ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
    - name: Configure sccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        variant: sccache
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.event_name == 'push' }}
        key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref }}
          ${{ runner.os }}-ccache
    - name: Restore Cached VCPKG folder
      id: restore-cache-vcpkg
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-vcpkg-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-${{ github.ref }}-
          ${{ runner.os }}-vcpkg-
        path: vcpkg
    - name: Configure Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
    - name: Download soh.o2r
      uses: actions/download-artifact@v7
      with:
        name: soh.o2r
        path: build-windows/soh
    - name: Build SoH
      env:
        VCPKG_ROOT: ${{github.workspace}}/vcpkg
      run: |
        set $env:PATH="$env:USERPROFILE/.cargo/bin;$env:PATH"
        cmake -S . -B build-windows -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DBUILD_REMOTE_CONTROL=1
        cmake --build build-windows --config Release --parallel 10

        (cd build-windows && cpack)
        cd ..
        mv _packages/*.zip _packages/soh-windows.zip
    - name: Upload mod SDK import library
      uses: actions/upload-artifact@v7
      with:
        name: unbound-mod-sdk-windows
        if-no-files-found: error
        path: x64/Release/soh.lib
    - name: Unzip package
      run: Expand-Archive -Path _packages/soh-windows.zip -DestinationPath soh-windows
    - name: Ship the mod import library next to soh.exe
      run: Copy-Item -Path x64/Release/soh.lib -Destination soh-windows/soh.lib
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: soh-windows
        path: soh-windows
    # The mod developers' edition asks before loading each unsigned mod; only ModLoader.cpp and the link rebuild.
    - name: Build the unsafe mods edition
      if: hashFiles('soh/soh/ModApi/ModLoader.cpp') != ''
      env:
        VCPKG_ROOT: ${{github.workspace}}/vcpkg
      run: |
        Remove-Item -Path _packages/*.zip -Force
        cmake -S . -B build-windows -DUNBOUND_MOD_POLICY=ask
        cmake --build build-windows --config Release --parallel 10
        (cd build-windows && cpack)
        cd ..
        mv _packages/*.zip _packages/soh-unbound-unsafe-windows.zip
        Expand-Archive -Path _packages/soh-unbound-unsafe-windows.zip -DestinationPath soh-unbound-unsafe-windows
        Copy-Item -Path x64/Release/soh.lib -Destination soh-unbound-unsafe-windows/soh.lib
    - name: Upload the unsafe mods edition
      if: hashFiles('soh/soh/ModApi/ModLoader.cpp') != ''
      uses: actions/upload-artifact@v7
      with:
        name: soh-unbound-unsafe-windows
        path: soh-unbound-unsafe-windows
    - name: Save Cache VCPKG folder
      if: ${{ github.event_name == 'push' }}
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-cache-vcpkg.outputs.cache-primary-key }}
        path: vcpkg

  # Fork-only: publish the GitHub Release on a release run.
  release:
    needs: [build-macos, build-linux, build-windows]
    if: inputs.tag
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        ref: refs/tags/${{ inputs.tag }}
        fetch-depth: 0
    - name: Identify product
      id: product
      shell: bash
      run: |
        FACTS=$(.github/workflows/release-product.sh "$TAG")
        echo "$FACTS" >> "$GITHUB_OUTPUT"
        PRODUCT=$(sed -n 's/^product=//p' <<< "$FACTS")
        # Release notes are generated against the previous tag of the same product, not the other one,
        # and never against a pipeline test tag.
        PREV=$(git tag --sort=-creatordate | grep -- "$PRODUCT" | grep -v -- '-test$' | grep -vx -- "$TAG" | head -n 1 || true)
        echo "prev=$PREV" >> "$GITHUB_OUTPUT"
    - name: Download macOS build
      uses: actions/download-artifact@v7
      with:
        name: soh-mac
        path: rel/mac
    - name: Download Linux build
      uses: actions/download-artifact@v7
      with:
        name: soh-linux
        path: rel/linux
    - name: Download Windows build
      uses: actions/download-artifact@v7
      with:
        name: soh-windows
        path: rel/windows
    - name: Download the unsafe mods editions
      uses: actions/download-artifact@v7
      with:
        pattern: soh-unbound-unsafe-*
        path: rel
    - name: Package release assets
      run: |
        mkdir -p dist
        cp "rel/mac/SoH.dmg" "dist/SoH-${TAG}-Mac.dmg"
        cp "rel/linux/soh.appimage" "dist/SoH-${TAG}-Linux.appimage"
        (cd rel/windows && zip -r "../../dist/SoH-${TAG}-Win64.zip" .)
        cp "rel/windows/soh.lib" "dist/soh.lib"
        if [ -d rel/soh-unbound-unsafe-windows ]; then
          cp "rel/soh-unbound-unsafe-mac/SoH-unbound-unsafe.dmg" "dist/SoH-${TAG}-Mac-unsafe-mods.dmg"
          cp "rel/soh-unbound-unsafe-linux/soh-unbound-unsafe.appimage" "dist/SoH-${TAG}-Linux-unsafe-mods.appimage"
          (cd rel/soh-unbound-unsafe-windows && zip -r "../../dist/SoH-${TAG}-Win64-unsafe-mods.zip" .)
        fi
    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        PRODUCT: ${{ steps.product.outputs.product }}
        TITLE: ${{ steps.product.outputs.title }}
        PREV: ${{ steps.product.outputs.prev }}
        DRAFT: ${{ steps.product.outputs.draft }}
      run: |
        NOTES_FILE=".github/release-notes/${PRODUCT}.md"
        ARGS=(--title "$TITLE" --generate-notes)
        [ -n "$PREV" ] && ARGS+=(--notes-start-tag "$PREV")
        [ -f "$NOTES_FILE" ] && ARGS+=(--notes-file "$NOTES_FILE")
        [ "$DRAFT" = true ] && ARGS+=(--draft)
        gh release create "$TAG" dist/* "${ARGS[@]}"
