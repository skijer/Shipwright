name: pr-artifacts

on:
  workflow_run:
    workflows: [generate-builds]
    types:
      - completed

jobs:
  pr-artifacts:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    steps:
      - id: 'pr-number'
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const {owner, repo} = context.repo;
            const pullHeadSHA = '${{github.event.workflow_run.head_sha}}';
            const pullUserId = ${{github.event.sender.id}};
            const prNumber = await (async () => {
              for await (const { data } of github.paginate.iterator(
                github.rest.pulls.list, { owner, repo }
              )) {
                for (const pull of data) {
                  if (pull.head.sha === pullHeadSHA && pull.user.id === pullUserId) {
                    return pull.number;
                  }
                }
              }
            })();

            if (!prNumber) {
              return core.error(`No matching pull request found`);
            }

            return prNumber;
      - id: 'artifacts-text'
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: context.payload.workflow_run.id,
            });
            const isUnsafe = (item) => item.name.startsWith('soh-unbound-unsafe-');
            const links = (items) => items
              .map((item) => `\n  - [${item.name}.zip](https://nightly.link/${owner}/${repo}/actions/artifacts/${item.id}.zip)`)
              .join('');
            const shown = artifacts.filter((item) => item.name !== 'soh.o2r');
            core.setOutput('build', '### Build Artifacts' + links(shown.filter((item) => !isUnsafe(item))));
            const unsafe = shown.filter(isUnsafe);
            core.setOutput('unsafe', unsafe.length ? '## UNSAFE, MODDING ONLY' + links(unsafe) : '');
      - id: 'add-to-pr'
        uses: garrettjoecox/pr-section@4.0.0
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          pr-number: ${{ steps.pr-number.outputs.result }}
          section-name: 'artifacts'
          section-value: '${{ steps.artifacts-text.outputs.build }}'
      - id: 'add-unsafe-to-pr'
        if: steps.artifacts-text.outputs.unsafe != ''
        uses: garrettjoecox/pr-section@4.0.0
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          pr-number: ${{ steps.pr-number.outputs.result }}
          section-name: 'unsafe-artifacts'
          section-value: '${{ steps.artifacts-text.outputs.unsafe }}'
