name: clang-format
on: [pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          submodules: true
      - name: Install formatting and regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14 nlohmann-json3-dev
      - name: Run clang-format
        run: |
          ./run-clang-format.sh
          git diff --exit-code
      - name: Transformation cosmetics and Zora shield regressions
        run: |
          python3 -B scripts/diagnostics/run_oot_custom_cosmetics_tests.py
          python3 -B scripts/diagnostics/run_zora_barrier_cosmetics_tests.py
      - name: Custom pedestal interaction and sword regressions
        run: |
          python3 -B scripts/diagnostics/run_time_pedestal_tests.py
          python3 -B scripts/diagnostics/run_pedestal_sword_selection_tests.py
          python3 -B scripts/diagnostics/check_time_pedestal_syntax.py
      - name: Stat items and chest regressions
        run: |
          python3 -B scripts/diagnostics/run_stat_upgrade_tests.py
          python3 -B scripts/diagnostics/run_chest_size_tests.py
          python3 -B scripts/diagnostics/run_time_gate_chest_tests.py
